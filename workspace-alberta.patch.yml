# workspaceAlberta / Warre & Vavasour deployment patch for the wa CLI.
# Secrets are resolved from the process environment and are never stored here.
#
# The default model route speaks Cohere Chat API v2. The configured baseURL is
# the prefix https://api.cohere.com/v2; llm-pi-ai appends /chat, so requests
# go to POST https://api.cohere.com/v2/chat with Bearer COHERE_API_KEY. Do not
# point this route at https://api.cohere.ai/compatibility/v1.
#
# Web search stays on Exa (searchProvider: exa, EXA_API_KEY). Do not register
# Cohere search on this desk. Fetch is the anonymous local HTTP provider.
# session-telemetry-otel is mounted (restored) but stays inert: mode defaults
# to DISABLED unless DSH_TELEMETRY_MODE opts in, and no collector URL exists
# in the environment, so nothing exports off-machine.

- id: llm-deepseek
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: web
  config:
    searchProvider: exa
    fetchProvider: http

- id: tool-web
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: agent-default-model
  config:
    provider: cohere-canada
    model: command-a-plus-05-2026

- id: llm-pi-ai
  config:
    providers:
      cohere-canada:
        displayName: Cohere (Canada)
        apiKeyEnv: COHERE_API_KEY
        api: cohere-v2-chat
        baseURL: https://api.cohere.com/v2
        models:
          - id: command-a-plus-05-2026
            name: Command A+
            contextWindow: 256000
            maxTokens: 32768
            input: [text]

- insert:
    - id: web-search-exa
      name: '@workspacealberta/wa-web-search-exa'

    - id: web-fetch-http
      name: '@workspacealberta/wa-web-fetch-http'

    - id: mcp-workspace-alberta
      name: '@workspacealberta/wa-mcp-client'
      config:
        transport: streamable-http
        serverName: workspace_alberta
        url: https://elbowsupknivesout.warreandvavasour.com/mcp
        headers: {}
        failOnStartupError: false

    # Alberta Grid v2 Wilke-honest AESO conversation view (tab label: Grid)
    - id: ui-alberta-grid
      name: '@workspacealberta/ui-alberta-grid'
