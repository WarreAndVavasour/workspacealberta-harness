# workspaceAlberta / Warre & Vavasour deployment layer for official dsh.
# Secrets are resolved from the process environment and are never stored here.
#
# Web tooling runs entirely on our side: the seam selects the Cohere v2
# tool-use search provider (web-search-cohere) plus the anonymous local HTTP
# fetch provider, and the DeepSeek-backed llm/web-search rows stay disabled.
# session-telemetry-otel is mounted (restored) but stays inert: mode defaults
# to DISABLED unless DSH_TELEMETRY_MODE opts in, and no collector URL exists
# in the environment, so nothing exports off-machine.

- id: credentials
  config:
    # Explicit local mode for a service whose EnvironmentFile supplies both keys.
    onePassword: !!js |
      process.env.WA_CREDENTIALS_MODE === 'env' ? undefined : ({
        refs: {
          COHERE_API_KEY: 'op://workspaceAlberta/Cohere/api-key',
          TYPESAFE_API_KEY: 'op://fgfcolfslsxo52ixowb647ohhy/uknc57xudh6vpov6zevz2pupne/credential'
        },
        records: {
          'client-connection/browser-session': 'op://workspaceAlberta/Harness/browser-session-record'
        }
      })

- id: llm-deepseek
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: web
  config:
    searchProvider: cohere
    fetchProvider: http

- id: tool-web
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: agent-default-model
  config:
    provider: cohere-canada
    model: command-a-plus-05-2026

- id: llm-pi-ai
  config:
    providers:
      cohere-canada:
        displayName: Cohere (Canada)
        apiKeyEnv: COHERE_API_KEY
        api: cohere-v2-chat
        baseURL: https://api.cohere.com/v2
        models:
          - id: command-a-plus-05-2026
            name: Command A+
            contextWindow: 256000
            maxTokens: 32768
            input: [text]

- insert:
    - id: workspace-project-tools
      name: '@workspacealberta/wa-project-tools'
      config:
        model: jev-1.14.0
        enableImages: true
        enableLongContext: true
        # Provisional review threshold; classifications never authorize actions.
        minConfidence: 0.9

    - id: web-search-cohere
      name: '@workspacealberta/web-search-cohere'
      config:
        apiKeyEnv: COHERE_API_KEY

    # web-fetch-http ships in the upstream base bundle as of 0.1.2 â€” no
    # insert needed here anymore.

    - id: mcp-workspace-alberta
      name: '@workspacealberta/wa-mcp-client'
      config:
        transport: streamable-http
        serverName: workspace_alberta
        url: https://elbowsupknivesout.warreandvavasour.com/mcp
        headers: {}
        failOnStartupError: false

    # Alberta Grid v2 Wilke-honest AESO conversation view (tab label: Grid)
    - id: ui-alberta-grid
      name: '@workspacealberta/ui-alberta-grid'
