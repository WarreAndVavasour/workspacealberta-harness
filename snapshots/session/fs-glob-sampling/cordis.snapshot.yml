# Minimal keyless composition: real app, bash, and search tool; replayed model.
- id: llm-deepseek
  name: '@workspacealberta/wa-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@workspacealberta/wa-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-pro

- id: subprocess
  name: '@workspacealberta/wa-subprocess-local'

- id: agent-default-model
  name: '@workspacealberta/wa-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@workspacealberta/wa-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@workspacealberta/wa-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@workspacealberta/wa-system-prompt'
  config:
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-jobs
  name: '@workspacealberta/wa-tool-jobs'
  disabled: true

- id: goal
  name: '@workspacealberta/wa-goal'
  disabled: true

- id: goal-round-driver
  name: '@workspacealberta/wa-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@workspacealberta/wa-command-goal'
  disabled: true

- id: tool-goal
  name: '@workspacealberta/wa-tool-goal'
  disabled: true

- id: skill
  name: '@workspacealberta/wa-skill'
  disabled: true

- id: skill-filesystem
  name: '@workspacealberta/wa-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@workspacealberta/wa-tool-skill'
  disabled: true

- id: tool-fs-search
  name: '@workspacealberta/wa-tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4

- id: spill-local
  name: '@workspacealberta/wa-spill-local'
  config:
    root: !!js process.env.DSH_SNAPSHOT_SPILL_ROOT ?? './.spill'
