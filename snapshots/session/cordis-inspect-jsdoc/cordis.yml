# Add PTC mode and Cordis tools to the base spawn/workflow stack, exercising
# all four boundaries in one ACP snapshot.
- id: agent-default-model
  name: '@workspacealberta/wa-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@workspacealberta/wa-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.DSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@workspacealberta/wa-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@workspacealberta/wa-tools'
  config:
    mode: both

- id: system-prompt
  name: '@workspacealberta/wa-system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: cordis-host-runner
      name: '@workspacealberta/wa-cordis-host-runner'
    - id: tool-cordis
      name: '@workspacealberta/wa-tool-cordis'
