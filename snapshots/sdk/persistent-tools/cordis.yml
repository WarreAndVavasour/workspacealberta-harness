# Per-launch SDK customization: retain only persistent Bash and the string
# editor as model-facing tools, with process-local providers and an explicit
# danger-full-access / never-ask policy.

- id: llm-deepseek
  name: '@workspacealberta/wa-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    streamIdleTimeoutMs: 172800000
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)

- id: sandbox-policy
  name: '@workspacealberta/wa-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: approval
  name: '@workspacealberta/wa-user-approval'
  config:
    policy: never

- id: permission
  name: '@workspacealberta/wa-permission-presets'
  disabled: true

- id: bash-sandbox
  name: '@workspacealberta/wa-bash-sandbox'
  disabled: true

- id: pwsh-sandbox
  name: '@workspacealberta/wa-pwsh-sandbox'
  disabled: true

- id: fs-sandbox
  name: '@workspacealberta/wa-fs-sandbox'
  disabled: true

- id: tool-bash
  name: '@workspacealberta/wa-tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@workspacealberta/wa-tool-pwsh'
  disabled: true

- id: agent-instructions
  name: '@workspacealberta/wa-agent-instructions'
  disabled: true

- id: skill
  name: '@workspacealberta/wa-skill'
  disabled: true

- id: skill-filesystem
  name: '@workspacealberta/wa-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@workspacealberta/wa-tool-skill'
  disabled: true

- id: tool-jobs
  name: '@workspacealberta/wa-tool-jobs'
  disabled: true

- id: tool-fs
  name: '@workspacealberta/wa-tool-fs'
  disabled: true

- id: tool-fs-search
  name: '@workspacealberta/wa-tool-fs-search'
  disabled: true

- id: tool-subagent-control
  name: '@workspacealberta/wa-tool-subagent-control'
  disabled: true

- id: tool-subagent-list-agents
  name: '@workspacealberta/wa-tool-subagent-control/list-agents'
  disabled: true

- id: tool-subagent
  name: '@workspacealberta/wa-tool-subagent'
  disabled: true

- id: tool-subagent-fork
  name: '@workspacealberta/wa-tool-subagent'
  disabled: true

- id: tool-workflow
  name: '@workspacealberta/wa-tool-workflow'
  disabled: true

- id: tool-todo
  name: '@workspacealberta/wa-tool-todo'
  disabled: true

- id: tool-goal
  name: '@workspacealberta/wa-tool-goal'
  disabled: true

- id: tool-ralph
  name: '@workspacealberta/wa-tool-ralph'
  disabled: true

- id: tool-web
  name: '@workspacealberta/wa-tool-web'
  disabled: true

- id: plan-mode
  name: '@workspacealberta/wa-plan-mode'
  disabled: true

- id: system-prompt
  name: '@workspacealberta/wa-system-prompt'
  config:
    includeHarnessIdentity: false
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a helpful software engineer assistant.'

- id: session-persistence-jsonl
  name: '@workspacealberta/wa-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: bash-local
      name: '@workspacealberta/wa-bash-local'

    - id: fs-local
      name: '@workspacealberta/wa-fs-local'
      config:
        cwd: !!js process.cwd()

    - id: terminal
      name: '@workspacealberta/wa-terminal'

    - id: terminal-bash
      name: '@workspacealberta/wa-terminal-bash'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@workspacealberta/wa-tool-bash-persistent'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * You do have access to a mirror of common linux and python packages via apt and pip.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.
