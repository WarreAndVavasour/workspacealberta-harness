# Keyless TypeScript SDK replay patch over the live profile patch.

- id: llm-deepseek
  name: '@workspacealberta/wa-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@workspacealberta/wa-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash

- id: session-log-deepseek
  name: '@workspacealberta/wa-session-log-deepseek'
  config:
    enabled: true
