# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@workspacealberta/wa-system-prompt'

- id: tools
  name: '@workspacealberta/wa-tools'

- id: subprocess
  name: '@workspacealberta/wa-subprocess-local'

- id: bash
  name: '@workspacealberta/wa-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@workspacealberta/wa-shell-env'

- id: tasks
  name: '@workspacealberta/wa-jobs-local'

- id: tool-jobs
  name: '@workspacealberta/wa-tool-jobs'

- id: tool-pwsh
  name: '@workspacealberta/wa-tool-pwsh'
